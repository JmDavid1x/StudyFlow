# Revisión automática: en cada push y PR a main corre el análisis y los tests.
# Si algo falla, el PR muestra la X roja y no se debería fusionar.
name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Botón "Run workflow" en Actions para armar el APK de cualquier rama.
  workflow_dispatch:

jobs:
  analizar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versión fija: la misma con la que trabaja el equipo. Con "stable" a secas,
      # cada versión nueva de Flutter puede romper el CI sin que cambie el código.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Al fusionar en main, GitHub arma el APK y lo deja para descargar en la
  # pestaña Actions → la corrida → Artifacts → "studyflow-apk".
  apk:
    needs: analizar-y-probar
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: studyflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
