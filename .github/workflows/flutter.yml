# Revisión automática: en cada push y PR a main corre el análisis y los tests.
# Si algo falla, el PR muestra la X roja y no se debería fusionar.
name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analizar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
